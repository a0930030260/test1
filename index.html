<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT 背景音訊播放器</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YT 播放器">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #bbb; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #ff0000;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active { background-color: #cc0000; }
        button:disabled { background-color: #555555; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 0.9rem; color: #888; word-break: break-all; }
        audio { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube 背景音訊播放器</h2>
    <input type="text" id="ytUrl" placeholder="貼上 YouTube 網址">
    <button id="playBtn" onclick="handlePlay()">解析並播放</button>
    <div id="status" class="status">請貼上網址並點擊播放</div>
</div>

<audio id="audioPlayer" playsinline preload="auto"></audio>

<script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const status = document.getElementById('status');

    // 預設常見的動態備用伺服器
    let dynamicInstances = [
        'https://inv.tux.pizza',
        'https://invidious.nerdvpn.de',
        'https://inv.privacydev.net',
        'https://invidious.drgns.space',
        'https://invidious.projectsegfau.lt'
    ];

    // 初始化時嘗試抓取官方健康的伺服器清單
    async function fetchFreshInstances() {
        try {
            const res = await fetch('https://api.invidious.io/instances.json?sort_by=health');
            if (res.ok) {
                const data = await res.json();
                const healthy = data
                    .filter(item => item[1].type === 'https' && item[1].health && item[1].health.percentage > 80)
                    .map(item => item[1].uri);
                if (healthy.length > 0) {
                    dynamicInstances = healthy.concat(dynamicInstances);
                }
            }
        } catch (e) {
            console.log('無法取得動態列表，使用預設伺服器清單');
        }
    }
    fetchFreshInstances();

    function extractVideoID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    async function handlePlay() {
        const url = document.getElementById('ytUrl').value.trim();
        const videoId = extractVideoID(url);

        if (!videoId) {
            alert('請輸入有效的 YouTube 網址！');
            return;
        }

        // 同一首歌曲切換 播放/暫停
        if (audio.getAttribute('data-id') === videoId && audio.src) {
            if (!audio.paused) {
                audio.pause();
            } else {
                audio.play();
            }
            return;
        }

        status.innerText = '正在尋找可用伺服器解析中...';
        playBtn.innerText = '載入中...';
        playBtn.disabled = true;

        let success = false;

        for (const instance of dynamicInstances) {
            try {
                // 設定 5 秒連線逾時，避免單一伺服器卡住
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const response = await fetch(`${instance}/api/v1/videos/${videoId}`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) continue;
                const data = await response.json();

                // 篩選 audio 格式
                const audioStream = data.adaptiveFormats.find(f => f.type && f.type.includes('audio/mp4')) ||
                                    data.adaptiveFormats.find(f => f.type && f.type.includes('audio/webm')) ||
                                    data.adaptiveFormats.find(f => f.type && f.type.includes('audio'));

                if (audioStream && audioStream.url) {
                    audio.src = audioStream.url;
                    audio.setAttribute('data-id', videoId);
                    
                    await audio.play();

                    status.innerText = `正在播放：${data.title}`;
                    playBtn.innerText = '暫停';
                    playBtn.disabled = false;
                    
                    setupMediaSession(data.title, data.author, videoId);
                    success = true;
                    break;
                }
            } catch (err) {
                console.warn(`伺服器 ${instance} 逾時或失敗，嘗試下一個...`);
            }
        }

        if (!success) {
            status.innerText = '解析失敗，所有代理伺服器皆忙碌中，請稍後重試！';
            playBtn.innerText = '解析並播放';
            playBtn.disabled = false;
        }
    }

    function setupMediaSession(title, artist, videoId) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title,
                artist: artist || 'YouTube',
                artwork: [
                    { src: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' }
                ]
            });

            navigator.mediaSession.setActionHandler('play', () => audio.play());
            navigator.mediaSession.setActionHandler('pause', () => audio.pause());
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.seekTime) {
                    audio.currentTime = details.seekTime;
                    updatePositionState();
                }
            });
        }
    }

    function updatePositionState() {
        if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
            if (!isNaN(audio.duration) && !isNaN(audio.currentTime)) {
                navigator.mediaSession.setPositionState({
                    duration: audio.duration,
                    playbackRate: audio.playbackRate,
                    position: audio.currentTime
                });
            }
        }
    }

    audio.addEventListener('play', () => {
        playBtn.innerText = '暫停';
        if (audio.getAttribute('data-id')) {
            status.innerText = '正在播放中...';
        }
    });

    audio.addEventListener('pause', () => {
        playBtn.innerText = '播放';
        status.innerText = '已暫停';
    });

    audio.addEventListener('timeupdate', updatePositionState);

    audio.addEventListener('ended', () => {
        status.innerText = '播放結束';
        playBtn.innerText = '解析並播放';
        audio.removeAttribute('data-id');
    });
</script>

</body>
</html>
