<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT 背景音訊播放器</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YT 播放器">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #bbb; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #ff0000;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active { background-color: #cc0000; }
        .status { margin-top: 15px; font-size: 0.9rem; color: #888; word-break: break-all; }
        /* 使用原生 audio 元素，但隱藏，全部透過 JS 與 MediaSession 控制 */
        audio { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube 背景音訊播放器</h2>
    <input type="text" id="ytUrl" placeholder="貼上 YouTube 網址">
    <button id="playBtn" onclick="handlePlay()">解析並播放</button>
    <div id="status" class="status">請貼上網址並點擊播放</div>
</div>

<audio id="audioPlayer" playsinline preload="auto"></audio>

<script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const status = document.getElementById('status');

    // 開放式 Invidious API 備用伺服器節點（用於提取 YouTube 音訊串流）
    const apiInstances = [
        'https://inv.iosbb.org',
        'https://invidious.nerdvpn.de',
        'https://vid.puffyan.us',
        'https://invidious.privacydev.net'
    ];

    function extractVideoID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    async function handlePlay() {
        const url = document.getElementById('ytUrl').value.trim();
        const videoId = extractVideoID(url);

        if (!videoId) {
            alert('請輸入有效的 YouTube 網址！');
            return;
        }

        // 若同首歌曲點擊按鈕，切換 播放 / 暫停
        if (audio.getAttribute('data-id') === videoId && audio.src) {
            if (!audio.paused) {
                audio.pause();
            } else {
                audio.play();
            }
            return;
        }

        status.innerText = '正在擷取音訊串流...';
        playBtn.innerText = '載入中...';
        playBtn.disabled = true;

        let success = false;

        // 輪詢可用 API 節點取得音訊檔直連網址
        for (const instance of apiInstances) {
            try {
                const response = await fetch(`${instance}/api/v1/videos/${videoId}`);
                if (!response.ok) continue;
                const data = await response.json();

                // 優先選擇格式為 m4a / webm 的純音訊檔
                const audioStream = data.adaptiveFormats.find(f => f.type && f.type.includes('audio/mp4')) ||
                                    data.adaptiveFormats.find(f => f.type && f.type.includes('audio/webm')) ||
                                    data.adaptiveFormats.find(f => f.type && f.type.includes('audio'));

                if (audioStream && audioStream.url) {
                    audio.src = audioStream.url;
                    audio.setAttribute('data-id', videoId);
                    
                    // 必須由點擊事件觸發播放，才能取得 iOS 鎖屏播放權限
                    await audio.play();

                    status.innerText = `正在播放：${data.title}`;
                    playBtn.innerText = '暫停';
                    playBtn.disabled = false;
                    
                    // 設定手機控制中心與鎖定螢幕模組
                    setupMediaSession(data.title, data.author, videoId);
                    success = true;
                    break;
                }
            } catch (err) {
                console.warn(`節點 ${instance} 連線失敗，嘗試下一個...`);
            }
        }

        if (!success) {
            status.innerText = '解析失敗，可能網路繁忙，請稍後重試！';
            playBtn.innerText = '解析並播放';
            playBtn.disabled = false;
        }
    }

    // 更新 MediaSession (鎖定螢幕卡片、進度條、控制鍵)
    function setupMediaSession(title, artist, videoId) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title,
                artist: artist || 'YouTube',
                artwork: [
                    { src: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' },
                    { src: `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`, sizes: '1280x720', type: 'image/jpeg' }
                ]
            });

            // 綁定鎖定螢幕按鈕操作
            navigator.mediaSession.setActionHandler('play', () => audio.play());
            navigator.mediaSession.setActionHandler('pause', () => audio.pause());
            
            // 綁定鎖定螢幕進度條拖動事件
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.seekTime) {
                    audio.currentTime = details.seekTime;
                    updatePositionState();
                }
            });
        }
    }

    // 定期同步進度條至鎖定螢幕
    function updatePositionState() {
        if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
            if (!isNaN(audio.duration) && !isNaN(audio.currentTime)) {
                navigator.mediaSession.setPositionState({
                    duration: audio.duration,
                    playbackRate: audio.playbackRate,
                    position: audio.currentTime
                });
            }
        }
    }

    // 監聽 HTML5 Audio 原生狀態
    audio.addEventListener('play', () => {
        playBtn.innerText = '暫停';
        if (audio.getAttribute('data-id')) {
            status.innerText = '正在播放中...';
        }
    });

    audio.addEventListener('pause', () => {
        playBtn.innerText = '播放';
        status.innerText = '已暫停';
    });

    audio.addEventListener('timeupdate', updatePositionState);

    audio.addEventListener('ended', () => {
        status.innerText = '播放結束';
        playBtn.innerText = '解析並播放';
        audio.removeAttribute('data-id');
    });
</script>

</body>
</html>
