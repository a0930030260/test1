<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT 背景音訊播放器</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YT 播放器">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #bbb; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #ff0000;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #cc0000; }
        .status { margin-top: 15px; font-size: 0.9rem; color: #888; }
        /* 隱藏官方影片區塊，只保留音訊播放 */
        #yt-player { display: none; }
    </style>
    <!-- 載入 YouTube 官方 API -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div class="container">
    <h2>YouTube 音訊播放器</h2>
    <input type="text" id="ytUrl" placeholder="貼上 YouTube 網址">
    <button id="playBtn" onclick="handlePlay()">播放</button>
    <div id="status" class="status">請輸入網址並點擊播放</div>
</div>

<!-- 隱藏的播放器容器 -->
<div id="yt-player"></div>

<script>
    let player = null;
    let isReady = false;

    // API 初始化完成的回呼函式
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-player', {
            height: '0',
            width: '0',
            events: {
                'onReady': () => { isReady = true; },
                'onStateChange': onPlayerStateChange,
                'onError': () => {
                    document.getElementById('status').innerText = '播放失敗，該影片可能禁止嵌入。';
                }
            }
        });
    }

    function extractVideoID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function handlePlay() {
        const url = document.getElementById('ytUrl').value.trim();
        const videoId = extractVideoID(url);
        const status = document.getElementById('status');

        if (!videoId) {
            alert('請輸入有效的 YouTube 網址！');
            return;
        }

        if (!isReady) {
            status.innerText = '播放器載入中，請稍後...';
            return;
        }

        // 若目前正在播放相同的影片，則切換 播放/暫停
        if (player.getVideoData() && player.getVideoData().video_id === videoId) {
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        } else {
            // 載入新影片並播放
            status.innerText = '正在載入...';
            player.loadVideoById(videoId);
        }
    }

    function onPlayerStateChange(event) {
        const status = document.getElementById('status');
        const btn = document.getElementById('playBtn');

        if (event.data === YT.PlayerState.PLAYING) {
            status.innerText = '正在播放中...';
            btn.innerText = '暫停';
            setupMediaSession();
        } else if (event.data === YT.PlayerState.PAUSED) {
            status.innerText = '已暫停';
            btn.innerText = '播放';
        } else if (event.data === YT.PlayerState.ENDED) {
            status.innerText = '播放結束';
            btn.innerText = '播放';
        }
    }

    // 綁定手機鎖定螢幕與背景控制項 (Media Session API)
    function setupMediaSession() {
        if ('mediaSession' in navigator && player) {
            const videoData = player.getVideoData();
            
            navigator.mediaSession.metadata = new MediaMetadata({
                title: videoData.title || 'YouTube 音訊',
                artist: videoData.author || 'YouTube',
                artwork: [
                    { 
                        src: `https://img.youtube.com/vi/${videoData.video_id}/hqdefault.jpg`, 
                        sizes: '480x360', 
                        type: 'image/jpeg' 
                    }
                ]
            });

            // 實作鎖定螢幕按鈕控制
            navigator.mediaSession.setActionHandler('play', () => player.playVideo());
            navigator.mediaSession.setActionHandler('pause', () => player.pauseVideo());
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.seekTime) {
                    player.seekTo(details.seekTime, true);
                }
            });
        }
    }
</script>

</body>
</html>
