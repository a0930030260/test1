<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT 背景音訊播放器</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YT 播放器">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #bbb; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #ff0000;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #cc0000; }
        .status { margin-top: 15px; font-size: 0.9rem; color: #888; }
        audio { width: 100%; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube 音訊播放器</h2>
    <input type="text" id="ytUrl" placeholder="貼上 YouTube 網址">
    <button id="playBtn" onclick="handlePlay()">解析並播放</button>
    <div id="status" class="status">請輸入網址並點擊播放</div>
    <audio id="audioPlayer" controls></audio>
</div>

<script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const status = document.getElementById('status');

    // 備用代理伺服器清單，自動切換以防單一伺服器失效
    const instances = [
        'https://inv.iosbb.org',
        'https://invidious.nerdvpn.de',
        'https://vid.puffyan.us'
    ];

    function extractVideoID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    async function handlePlay() {
        const url = document.getElementById('ytUrl').value.trim();
        const videoId = extractVideoID(url);

        if (!videoId) {
            alert('請輸入有效的 YouTube 網址！');
            return;
        }

        // 切換按鈕狀態（點擊切換播放/暫停）
        if (audio.src && !audio.paused) {
            audio.pause();
            status.innerText = '已暫停';
            playBtn.innerText = '播放';
            return;
        } else if (audio.src && audio.paused && audio.getAttribute('data-id') === videoId) {
            audio.play();
            status.innerText = '正在播放...';
            playBtn.innerText = '暫停';
            return;
        }

        status.innerText = '正在解析音訊...';
        playBtn.innerText = '載入中...';

        let success = false;

        // 輪詢可用節點，取得音訊檔
        for (const instance of instances) {
            try {
                const res = await fetch(`${instance}/api/v1/videos/${videoId}`);
                if (!res.ok) continue;
                const data = await res.json();

                // 篩選純音訊串流 (Audio Only)
                const audioFormat = data.adaptiveFormats.find(f => f.type && f.type.includes('audio/webm')) || 
                                    data.adaptiveFormats.find(f => f.type && f.type.includes('audio'));

                if (audioFormat && audioFormat.url) {
                    audio.src = audioFormat.url;
                    audio.setAttribute('data-id', videoId);
                    await audio.play();

                    status.innerText = `正在播放：${data.title}`;
                    playBtn.innerText = '暫停';
                    
                    // 啟用手機鎖定螢幕控制項
                    setupMediaSession(data.title, data.author, data.videoThumbnails);
                    success = true;
                    break;
                }
            } catch (err) {
                console.warn(`節點 ${instance} 失敗，嘗試下一個...`);
            }
        }

        if (!success) {
            status.innerText = '解析失敗，請確認網址或稍後再試。';
            playBtn.innerText = '解析並播放';
        }
    }

    // 鎖定螢幕與背景控制功能 (Media Session API)
    function setupMediaSession(title, artist, thumbnails) {
        if ('mediaSession' in navigator) {
            let coverUrl = 'https://via.placeholder.com/512';
            if (thumbnails && thumbnails.length > 0) {
                coverUrl = thumbnails[0].url;
            }

            navigator.mediaSession.metadata = new MediaMetadata({
                title: title,
                artist: artist || 'YouTube',
                artwork: [{ src: coverUrl, sizes: '512x512', type: 'image/jpeg' }]
            });

            navigator.mediaSession.setActionHandler('play', () => {
                audio.play();
                playBtn.innerText = '暫停';
                status.innerText = '正在播放...';
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                audio.pause();
                playBtn.innerText = '播放';
                status.innerText = '已暫停';
            });
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.seekTime) {
                    audio.currentTime = details.seekTime;
                }
            });
        }
    }

    // 監聽原生日誌變化
    audio.onended = () => {
        status.innerText = '播放結束';
        playBtn.innerText = '解析並播放';
    };
</script>

</body>
</html>
